<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FriendMail</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

  <!-- Status Toast -->
  <div id="status-message" hidden></div>

  <!-- Auth View -->
  <div id="auth-view" class="view-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="login-tab" class="active">Login</button>
        <button id="register-tab">Register</button>
      </div>
      <h2 id="auth-title">Welcome back</h2>
      <p id="auth-description">Sign in to continue</p>
      
      <form id="auth-form">
        <div id="auth-error" class="error-text" hidden></div>
        <input type="text" id="username" placeholder="Username" required autocomplete="username">
        <input type="password" id="password" placeholder="Password" required autocomplete="current-password">
        <div id="password-help" class="help-text" hidden>Use a strong password.</div>
        <button type="submit" id="auth-submit" class="btn-primary">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Mail View -->
  <div id="mail-view" class="view-container" hidden>
    <header class="app-header">
      <div class="header-left">
        <h1>FriendMail</h1>
      </div>
      <div class="header-search">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="message-search" placeholder="Search mail...">
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <div class="user-profile">
          <div id="signed-in-avatar" class="avatar">?</div>
          <span id="signed-in-as"></span>
        </div>
        <button id="logout-button" class="icon-btn" title="Log Out">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar">
        <button id="compose-open" class="btn-primary compose-btn">
          <span class="material-symbols-outlined">edit</span> Compose
        </button>
        <nav class="folder-list">
          <button class="folder active" data-folder="inbox">
            <span class="material-symbols-outlined">inbox</span> Inbox 
            <span id="inbox-count" class="badge"></span>
          </button>
          <button class="folder" data-folder="sent">
            <span class="material-symbols-outlined">send</span> Sent
          </button>
        </nav>
      </aside>

      <main class="message-area">
        <div class="toolbar">
          <button id="refresh-button" class="icon-btn" title="Refresh">
            <span class="material-symbols-outlined">refresh</span>
          </button>
          <span id="message-total" class="meta-text"></span>
        </div>
        <div id="message-list">
          <!-- Messages render here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Compose Dialog -->
  <dialog id="compose-dialog" class="modal">
    <div class="dialog-header">
      <h3>New Message</h3>
      <div style="display: flex; gap: 4px;">
        <button type="button" id="compose-maximize" class="icon-btn" title="Toggle Fullscreen">
          <span class="material-symbols-outlined">fullscreen</span>
        </button>
        <button type="button" id="compose-close" class="icon-btn" title="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <form id="compose-form">
      <div id="compose-error" class="error-text"></div>
      <input type="text" id="recipient" placeholder="To" required list="contacts-list">
      <datalist id="contacts-list"></datalist>
      <input type="text" id="subject" placeholder="Subject">
      
      <div class="rich-text-toolbar">
        <button type="button" class="format-btn icon-btn" data-command="bold" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
        <button type="button" class="format-btn icon-btn" data-command="italic" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
        <button type="button" class="format-btn icon-btn" data-command="underline" title="Underline"><span class="material-symbols-outlined">format_underlined</span></button>
        <button type="button" class="format-btn icon-btn" data-command="createLink" title="Insert Link"><span class="material-symbols-outlined">link</span></button>
        <button type="button" class="format-btn icon-btn" data-command="insertUnorderedList" title="Bullet List"><span class="material-symbols-outlined">format_list_bulleted</span></button>
      </div>
      <div id="body" class="rich-text-editor" contenteditable="true" aria-placeholder="Type your message here..."></div>
      
      <div class="dialog-footer">
        <button type="submit" id="send-button" class="btn-primary">Send</button>
      </div>
    </form>
  </dialog>

  <!-- Message Detail Dialog -->
  <dialog id="message-dialog" class="modal detail-modal">
    <div class="dialog-header">
      <h3 id="detail-subject"></h3>
      <button type="button" id="detail-close" class="icon-btn" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="detail-header-info">
      <div id="detail-avatar" class="avatar"></div>
      <div class="detail-sender-info">
        <div id="detail-from"></div>
        <div id="detail-meta" class="meta-text"></div>
      </div>
    </div>
    <div id="detail-body" class="detail-content"></div>
    <div class="dialog-footer">
      <button type="button" id="reply-button" class="btn-outline">
        <span class="material-symbols-outlined">reply</span> Reply
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
