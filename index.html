<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FriendMail - Secure Inbox</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>
<body>

  <!-- Status Toast -->
  <div id="status-message" hidden></div>

  <!-- Auth View -->
  <div id="auth-view" class="view-container">
    <div class="auth-split">
      <div class="auth-branding">
        <div class="brand-badge"><span class="material-symbols-outlined">shield_lock</span> Secure</div>
        <h1>Privacy by Default.</h1>
        <p>Experience email the way it was meant to be. Clean, fast, and completely yours.</p>
      </div>
      <div class="auth-card-container">
        <div class="auth-card">
          <div class="auth-header">
            <span class="material-symbols-outlined auth-logo">lock</span>
            <h2>FriendMail</h2>
          </div>
          <div class="auth-tabs">
            <button id="login-tab" class="active">Sign in</button>
            <button id="register-tab">Create account</button>
          </div>
          <h3 id="auth-title">Sign in</h3>
          <p id="auth-description">Continue to your secure inbox</p>
          
          <form id="auth-form">
            <div id="auth-error" class="error-text" hidden></div>
            <div class="input-group">
              <label for="username">Username</label>
              <input type="text" id="username" required autocomplete="username" placeholder="e.g. yourname">
            </div>
            <div class="input-group">
              <label for="password">Password</label>
              <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••••••">
            </div>
            <div id="password-help" class="help-text" hidden>Use at least 10 characters.</div>
            <button type="submit" id="auth-submit" class="btn-primary auth-btn">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Mail View -->
  <div id="mail-view" class="view-container" hidden>
    <header class="app-header">
      <div class="header-left">
        <button id="sidebar-toggle" class="icon-btn" title="Toggle Menu">
          <span class="material-symbols-outlined">menu</span>
        </button>
        <span class="material-symbols-outlined brand-icon">lock</span>
        <h1>FriendMail</h1>
      </div>
      <div class="header-search">
        <span class="material-symbols-outlined search-icon">search</span>
        <input type="text" id="message-search" placeholder="Search messages or contacts (/ to focus)">
      </div>
      <div class="header-right">
        <button id="theme-toggle" class="icon-btn" title="Toggle Theme">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <div class="user-profile">
          <div id="signed-in-avatar" class="avatar"></div>
          <span id="signed-in-as"></span>
        </div>
        <button id="logout-button" class="icon-btn" title="Sign out">
          <span class="material-symbols-outlined">logout</span>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar" id="app-sidebar">
        <button id="compose-open" class="btn-primary compose-btn">
          <span class="material-symbols-outlined">edit</span>
          <span class="sidebar-text">New message</span>
        </button>
        <nav class="folder-list">
          <button class="folder active" data-folder="inbox">
            <span class="material-symbols-outlined">inbox</span> 
            <span class="sidebar-text">Inbox</span>
            <span id="inbox-count" class="badge"></span>
          </button>
          <button class="folder" data-folder="sent">
            <span class="material-symbols-outlined">send</span> 
            <span class="sidebar-text">Sent</span>
          </button>
        </nav>
      </aside>

      <main class="message-area">
        <div class="toolbar">
          <div class="toolbar-left">
            <button id="refresh-button" class="icon-btn outline" title="Refresh">
              <span class="material-symbols-outlined">refresh</span>
            </button>
          </div>
          <span id="message-total" class="meta-text"></span>
        </div>
        <div id="message-list">
          <!-- Messages & Skeletons render here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Compose Dialog -->
  <dialog id="compose-dialog" class="modal proton-modal">
    <div class="dialog-header">
      <h3>New message</h3>
      <div class="dialog-controls">
        <button type="button" id="compose-maximize" class="icon-btn small" title="Toggle Fullscreen">
          <span class="material-symbols-outlined">fullscreen</span>
        </button>
        <button type="button" id="compose-close" class="icon-btn small" title="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
    </div>
    <form id="compose-form">
      <div id="compose-error" class="error-text" hidden></div>
      <div class="compose-field">
        <label for="recipient">To</label>
        <input type="text" id="recipient" required list="contacts-list">
        <datalist id="contacts-list"></datalist>
      </div>
      <div class="compose-field border-bottom">
        <label for="subject">Subject</label>
        <input type="text" id="subject">
      </div>
      
      <div class="rich-text-toolbar">
        <button type="button" class="format-btn icon-btn small" data-command="bold" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
        <button type="button" class="format-btn icon-btn small" data-command="italic" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
        <button type="button" class="format-btn icon-btn small" data-command="underline" title="Underline"><span class="material-symbols-outlined">format_underlined</span></button>
        <div class="divider"></div>
        <button type="button" class="format-btn icon-btn small" data-command="createLink" title="Insert Link"><span class="material-symbols-outlined">link</span></button>
        <button type="button" class="format-btn icon-btn small" data-command="insertUnorderedList" title="Bullet List"><span class="material-symbols-outlined">format_list_bulleted</span></button>
      </div>
      <div id="body" class="rich-text-editor" contenteditable="true" aria-placeholder="Type a secure message..."></div>
      
      <div class="dialog-footer">
        <button type="submit" id="send-button" class="btn-primary">
          <span class="material-symbols-outlined">send</span> Send
        </button>
      </div>
    </form>
  </dialog>

  <!-- Message Detail Dialog -->
  <dialog id="message-dialog" class="modal detail-modal">
    <div class="dialog-header">
      <h3 id="detail-subject"></h3>
      <button type="button" id="detail-close" class="icon-btn small" title="Close">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="detail-header-info">
      <div id="detail-avatar" class="avatar lg"></div>
      <div class="detail-sender-info">
        <div id="detail-from"></div>
        <div id="detail-meta" class="meta-text"></div>
      </div>
    </div>
    <div id="detail-body" class="detail-content"></div>
    <div class="dialog-footer">
      <button type="button" id="reply-button" class="btn-primary outline">
        <span class="material-symbols-outlined" style="font-size:18px;">reply</span> Reply
      </button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
