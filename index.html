<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fc">
  <title>FriendMail</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- AUTHENTICATION VIEW -->
  <section id="auth-view" class="auth-wrapper">
    <div class="auth-box">
      <div class="auth-header">
        <span class="material-symbols-outlined auth-logo-icon">mail</span>
        <h2>FriendMail</h2>
        <p id="auth-description">Sign in to continue</p>
      </div>
      
      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab" type="button">Sign In</button>
        <button class="auth-tab" id="register-tab" type="button">Create Account</button>
      </div>

      <form id="auth-form" class="auth-form">
        <h3 id="auth-title" class="sr-only">Welcome back</h3>
        
        <div class="input-group">
          <input id="username" name="username" type="text" autocomplete="username" minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+" required placeholder=" ">
          <label for="username">Username</label>
        </div>
        
        <div class="input-group">
          <input id="password" name="password" type="password" autocomplete="current-password" minlength="10" required placeholder=" ">
          <label for="password">Password</label>
        </div>
        
        <p id="password-help" class="helper-text" hidden>At least 10 characters.</p>
        <div id="auth-error" class="error-text" hidden></div>
        
        <div class="auth-actions">
          <button id="auth-submit" class="md-button md-primary" type="submit">Sign In</button>
        </div>
      </form>
    </div>
  </section>

  <!-- MAIN MAIL VIEW -->
  <section id="mail-view" class="app-layout" hidden>
    
    <!-- Top App Bar -->
    <header class="app-bar">
      <div class="bar-left">
        <button class="icon-button" aria-label="Menu"><span class="material-symbols-outlined">menu</span></button>
        <a class="brand" href="#"><span class="material-symbols-outlined brand-icon">mail</span><span class="brand-text">FriendMail</span></a>
      </div>
      
      <div class="bar-center">
        <div class="search-box">
          <span class="material-symbols-outlined search-icon">search</span>
          <input id="message-search" type="search" placeholder="Search mail" aria-label="Search">
        </div>
      </div>
      
      <div class="bar-right" id="account-area">
        <button id="theme-toggle" class="icon-button" type="button" aria-label="Toggle theme"><span class="material-symbols-outlined">dark_mode</span></button>
        <div class="user-avatar-wrap" title="Account settings">
          <div class="user-avatar" id="signed-in-avatar">U</div>
          <div class="user-dropdown">
            <div class="dropdown-header">
              <span id="signed-in-as"></span>
            </div>
            <button id="logout-button" class="dropdown-item"><span class="material-symbols-outlined">logout</span> Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <div class="app-body">
      <!-- Sidebar Drawer -->
      <aside class="app-drawer">
        <button id="compose-open" class="compose-fab" type="button">
          <span class="material-symbols-outlined">edit</span>
          <span class="fab-text">Compose</span>
        </button>
        
        <nav class="drawer-nav">
          <button class="folder active" data-folder="inbox" type="button">
            <span class="material-symbols-outlined">inbox</span>
            <span class="folder-name">Inbox</span>
            <span id="inbox-count" class="folder-badge"></span>
          </button>
          <button class="folder" data-folder="sent" type="button">
            <span class="material-symbols-outlined">send</span>
            <span class="folder-name">Sent</span>
          </button>
        </nav>
      </aside>

      <!-- Main Mail Content -->
      <main class="app-content">
        <div class="content-toolbar">
          <button id="refresh-button" class="icon-button" type="button" title="Refresh"><span class="material-symbols-outlined">refresh</span></button>
          <button class="icon-button" type="button" title="More"><span class="material-symbols-outlined">more_vert</span></button>
          <div class="toolbar-spacer"></div>
          <span id="message-total" class="pagination-text"></span>
        </div>
        
        <div id="status-message" class="toast" hidden></div>
        
        <div class="mail-list-container">
          <div id="message-list" class="message-list"></div>
        </div>
      </main>
    </div>
  </section>

  <!-- COMPOSE DIALOG (Floating Bottom Right) -->
  <dialog id="compose-dialog" class="floating-compose">
    <form id="compose-form" method="dialog">
      <div class="compose-header">
        <h3>New Message</h3>
        <button id="compose-close" class="icon-button small" type="button"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div class="compose-body">
        <div class="compose-field">
          <label for="recipient">To</label>
          <input id="recipient" name="recipient" maxlength="20" required>
        </div>
        <div class="compose-field">
          <label for="subject" class="sr-only">Subject</label>
          <input id="subject" name="subject" maxlength="120" placeholder="Subject" required>
        </div>
        <textarea id="body" name="body" maxlength="5000" required></textarea>
      </div>
      <div class="compose-footer">
        <button id="send-button" class="md-button md-primary rounded" type="submit">Send</button>
        <span id="compose-error" class="error-text"></span>
      </div>
    </form>
  </dialog>

  <!-- READ MESSAGE DIALOG -->
  <dialog id="message-dialog" class="read-dialog">
    <div class="read-header">
      <div class="read-subject-row">
        <h2 id="detail-subject"></h2>
      </div>
      <div class="read-meta-row">
        <div class="read-sender">
          <div class="user-avatar small" id="detail-avatar"></div>
          <div>
            <div id="detail-from" class="sender-name"></div>
            <div class="recipient-name">to me</div>
          </div>
        </div>
        <div class="read-date" id="detail-meta"></div>
      </div>
    </div>
    <div id="detail-body" class="read-body"></div>
    <div class="read-actions">
      <button id="reply-button" class="md-button md-outlined" type="button"><span class="material-symbols-outlined">reply</span> Reply</button>
      <button id="detail-close" class="md-button md-text" type="button">Close</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
